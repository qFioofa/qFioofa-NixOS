# Calendar layout for the NixOS rofi desktop.
# Dates only: events, note folders and CalDAV are intentionally disabled.

[LOCALE]
USER_LOCALE =

[HEADER]
PROMT_DATE_FORMAT = %B %Y
IS_TODAY_HEAD_MSG = True
IS_LOOP_TODAY_HEAD_MSG = False
TODAY_HEAD_MSG_TXT = <span rise="0" size="xx-large" color="@primary@">%d</span> <span rise="12000" size="small" color="@fgMuted@">%A</span>

[DAY NAMES]
DAY_ABBR_LENGHT = 3
FIRST_DAY_WEEK = 1

[CONTROL]
SYM_NEXT_MONTH = ▶, >, +, n
SYM_NEXT_YEAR = ▶▶, >>, ++, nn
SYM_PREV_MONTH = ◀, <, -, p
SYM_PREV_YEAR = ◀◀, <<, --, pp

[CONTENT]
ROW_DAY_NAMES = 0
ROW_CAL_START = 1
ROW_BAR_1 = 7
ROW_BAR_2 =
SYMS_BAR_1 = pp, p, bb, m,  , n, nn
SYMS_BAR_2 =

[SHORTCUTS]
SYM_SHOW_HELP = 󰋽, help, hh, 󰋽 Keybindings
SYM_SWITCH_THEME = 󰏘, theme, tt, 󰏘 Theme
SYM_SHOW_EVENTS = 󰃭, event, ee, 󰃭 Events
SYM_SWITCH_EVENT = 󰉋, switch, ss, 󰉋 Event type
SYM_SHOW_MENU = ☰, menu, mm, ☰ Menu
SYM_BACK_TO_CALENDAR = 󰁍, back, _, 󰁍 Back
SYM_GO_TODAY = 󰃭, today, bb, 󰃭 Today
